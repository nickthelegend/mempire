[package]
name = "mempire-rollup"
version = "0.1.0"
description = "Mempire match log on a MagicBlock ephemeral rollup"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mempire_rollup"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
# Deliberately no anchor-spl. This program never touches a token account, and
# omitting it is most of the reason the binary is small enough to deploy.
anchor-lang = "0.32.1"
# `access-control` brings the PER permission CPIs; `vrf` brings the randomness
# request/callback macros. Both are additive to `anchor-compat`, which is the
# feature that targets Anchor >=0.28,<1.0 (plain `anchor` targets Anchor 1.x).
ephemeral-rollups-sdk = { version = "0.16.2", features = [
  "anchor-compat",
  "access-control",
  "vrf",
] }

[lints.rust]
# `cfg(target_os = "solana")` is set by the SBF toolchain, not by cargo's known
# list, so a host-side `cargo check` warns about it. Same declaration the main
# program carries.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
