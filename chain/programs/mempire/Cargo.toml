[package]
name = "mempire"
version = "0.1.0"
description = "Mempire — meme coin card battler on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mempire"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = "0.32.1"
# MagicBlock Ephemeral Rollups. `anchor-compat` is the correct feature for
# Anchor >=0.28,<1.0 — the plain `anchor` feature targets Anchor 1.x and will
# not compile against 0.32.1.
ephemeral-rollups-sdk = { version = "0.16.2", features = ["anchor-compat"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
