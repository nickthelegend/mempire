<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Mempire — day 2 (overlay)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* The game's own display face, embedded rather than named.
         Lilita One is not one of the renderer's pre-bundled families, so
         writing the name alone would lean on an implicit build-time Google
         fetch — a lint warning locally and a hard failure in a cloud render.
         This file comes from the app's own @fontsource dependency, so the
         video and the game are set in literally the same cut. */
      @font-face {
        font-family: 'Lilita One';
        src: url('assets/fonts/lilita-one.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }

      :root {
        --ink: #10203f;
        --gold: #ffc422;
        --gold-hi: #ffe38a;
        --blue-pale: #59a6f5;
        --teal: #14f195;
        --purple: #9945ff;
        --dim: #b9d4f7;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: transparent; }

      #root {
        position: relative;
        background: transparent;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        font-family: 'Montserrat', system-ui, sans-serif;
        color: #fff;
      }

      /* The scene fill lives on a full-bleed child, never on the root — the
         producer's frame compositing can drop a root background and render
         the frame black while preview looks correct. */
      .bg {
        position: absolute;
        inset: 0;
        background:
          repeating-linear-gradient(45deg, rgba(255,196,34,.05) 0 2px, transparent 2px 84px),
          repeating-linear-gradient(-45deg, rgba(255,196,34,.05) 0 2px, transparent 2px 84px),
          radial-gradient(130% 90% at 50% -10%, #4a2a86 0%, #2a1660 42%, #150d33 100%);
      }

      /* Scrims. The copy sits on moving footage, so it needs its own floor —
         without these the checklist is legible over the grass and invisible
         the moment a gold knight walks under it. */
      .scrim {
        position: absolute;
        left: 0;
        width: 1080px;
        pointer-events: none;
      }
      .scrim-top {
        top: 0;
        height: 620px;
        background: linear-gradient(180deg, rgba(9,11,26,.95) 0%, rgba(9,11,26,.84) 46%, rgba(9,11,26,0) 100%);
      }
      .scrim-bot {
        bottom: 0;
        height: 900px;
        background: linear-gradient(0deg, rgba(9,11,26,.97) 0%, rgba(9,11,26,.9) 40%, rgba(9,11,26,0) 100%);
      }

      /* ── type ─────────────────────────────────────────────────────────── */
      .display {
        font-family: 'Lilita One', system-ui, sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.012em;
        line-height: 0.94;
        -webkit-text-stroke: 0.075em var(--ink);
        paint-order: stroke fill;
        text-shadow: 0 0.05em 0 rgba(0, 0, 0, 0.55);
      }

      #logo {
        position: absolute;
        top: 88px;
        left: 350px;
        width: 380px;
        /* Explicit, not auto: the wordmark is 512x249, and an auto height that
           resolves before the PNG decodes let the element stretch to a
           full-height smear across the first third of the render. */
        height: 185px;
        display: block;
      }

      #daychip {
        position: absolute;
        top: 296px;
        left: 365px;
        width: 350px;
        display: block;
        text-align: center;
        padding: 14px 0 12px;
        border-radius: 999px;
        border: 4px solid var(--ink);
        background: linear-gradient(180deg, #ffe38a, #ffc422 52%, #e0a105);
        color: #3a2600;
        font-family: 'Lilita One', system-ui, sans-serif;
        text-transform: uppercase;
        font-size: 40px;
        letter-spacing: 0.06em;
        box-shadow: inset 0 3px 0 rgba(255,255,255,.5), 0 8px 0 #8a5c05, 0 14px 26px rgba(0,0,0,.5);
      }

      #headline {
        position: absolute;
        top: 402px;
        left: 60px;
        width: 960px;
        display: block;
        text-align: center;
        font-size: 86px;
        color: #fff;
      }

      /* ── the checklist ───────────────────────────────────────────────── */
      #list {
        position: absolute;
        left: 72px;
        top: 1300px;
        width: 936px;
      }
      .row {
        display: flex;
        align-items: flex-start;
        gap: 22px;
        margin-bottom: 30px;
      }
      /* Transformed elements must be block-level and sized — a scaled
         auto-width inline box has nothing to scale. */
      .tick {
        display: block;
        flex: 0 0 auto;
        width: 62px;
        height: 62px;
        border-radius: 16px;
        border: 4px solid var(--ink);
        font-family: 'Lilita One', system-ui, sans-serif;
        font-size: 36px;
        line-height: 54px;
        text-align: center;
        color: #08301c;
      }
      .tick-done { background: linear-gradient(180deg, #6dffc0, var(--teal) 60%, #08b96a); }
      .tick-part { background: linear-gradient(180deg, #cfa6ff, var(--purple) 60%, #6b21c9); color: #fff; }
      .rowtext { display: block; padding-top: 2px; }
      .rowtitle {
        display: block;
        font-family: 'Lilita One', system-ui, sans-serif;
        text-transform: uppercase;
        font-size: 46px;
        line-height: 1;
        color: #fff;
        -webkit-text-stroke: 0.05em var(--ink);
        paint-order: stroke fill;
      }
      .rowsub {
        display: block;
        margin-top: 9px;
        font-size: 28px;
        font-weight: 700;
        color: var(--dim);
      }

      #url {
        position: absolute;
        left: 0;
        bottom: 138px;
        width: 1080px;
        display: block;
        text-align: center;
        font-size: 58px;
        color: var(--gold-hi);
      }
      #blitz {
        position: absolute;
        left: 0;
        bottom: 78px;
        width: 1080px;
        display: block;
        text-align: center;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--blue-pale);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="10"
    >
      <div id="scrim-top" class="scrim scrim-top clip" data-start="0" data-duration="10" data-track-index="2"></div>
      <div id="scrim-bot" class="scrim scrim-bot clip" data-start="0" data-duration="10" data-track-index="3"></div>

      <img id="logo" class="clip" src="assets/logo.png" alt="Mempire"
           data-start="0" data-duration="10" data-track-index="4" />

      <div id="daychip" class="clip" data-start="0.35" data-duration="9.65" data-track-index="5">
        Day 2
      </div>

      <h1 id="headline" class="display clip" data-start="1.1" data-duration="8.9" data-track-index="6">
        It looks like a game now
      </h1>

      <div id="list" class="clip" data-start="2.4" data-duration="7.6" data-track-index="7">
        <div class="row" id="r1">
          <span class="tick tick-done">✓</span>
          <span class="rowtext">
            <span class="rowtitle">Design — done</span>
            <span class="rowsub">64 fighters, the arena, the whole UI</span>
          </span>
        </div>
        <div class="row" id="r2">
          <span class="tick tick-done">✓</span>
          <span class="rowtext">
            <span class="rowtitle">Onchain — live</span>
            <span class="rowsub">MagicBlock ER + PER + VRF, on devnet</span>
          </span>
        </div>
        <div class="row" id="r3">
          <span class="tick tick-part">→</span>
          <span class="rowtext">
            <span class="rowtitle">Next — the rest</span>
            <span class="rowsub">Ranked, payouts, mainnet</span>
          </span>
        </div>
      </div>

      <div id="url" class="display clip" data-start="7.6" data-duration="2.4" data-track-index="8">
        mempire.fun
      </div>
      <div id="blitz" class="clip" data-start="7.9" data-duration="2.1" data-track-index="9">
        Solana Blitz V7
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Initial states are set inside the tweens, never as a CSS transform —
      // a CSS transform plus a GSAP tween on the same property fight, and
      // lint rejects the pair.
      tl.fromTo('#logo', { y: -40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: 'power3.out' }, 0);

      // The chip stamps rather than fades: it is the one element carrying the
      // "day 2" claim, and a stamp reads as a mark being made.
      tl.fromTo('#daychip',
        { scale: 1.5, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.42, ease: 'back.out(2.2)' }, 0.35);

      tl.fromTo('#headline', { y: 46, opacity: 0 }, { y: 0, opacity: 1, duration: 0.66, ease: 'power3.out' }, 1.1);

      // The three claims land one at a time, so each is read rather than
      // scanned as a block.
      ['#r1', '#r2', '#r3'].forEach(function (sel, i) {
        tl.fromTo(sel,
          { x: -54, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.52, ease: 'power3.out' }, 2.4 + i * 0.85);
        tl.fromTo(sel + ' .tick',
          { scale: 0 },
          { scale: 1, duration: 0.42, ease: 'back.out(3)' }, 2.4 + i * 0.85 + 0.12);
      });

      // The headline steps aside for the close so the URL owns the last beat.
      tl.to('#headline', { y: -26, opacity: 0, duration: 0.5, ease: 'power2.in' }, 7.3);

      tl.fromTo('#url', { scale: 0.86, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: 'back.out(1.8)' }, 7.6);
      tl.fromTo('#blitz', { opacity: 0 }, { opacity: 1, duration: 0.45, ease: 'power2.out' }, 7.9);

      window.__timelines['main'] = tl;
    </script>
  </body>
</html>
