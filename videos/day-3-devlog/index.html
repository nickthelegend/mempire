<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Mempire — day 3 (overlay)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* The game's own display face. Lilita One is not one of the renderer's
         pre-bundled families, so naming it would lean on an implicit Google
         fetch — a lint warning locally and fail-closed in a cloud render. This
         file is the app's own @fontsource copy. */
      @font-face {
        font-family: 'Lilita One';
        src: url('assets/fonts/lilita-one.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }

      :root {
        --ink: #10203f;
        --gold: #ffc422;
        --gold-hi: #ffe38a;
        --blue-pale: #59a6f5;
        --teal: #14f195;
        --dim: #b9d4f7;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      /* Transparent: the tour is composited underneath by ffmpeg, not placed
         in the composition. `videos/day-2-devlog/BRIEF.md` has the why. */
      body { background: transparent; }

      #root {
        position: relative;
        background: transparent;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        font-family: 'Montserrat', system-ui, sans-serif;
        color: #fff;
      }

      /* This cut is a tour of dense menu UI, not an arena. Day 2 could afford
         a three-row checklist over grass; here every pixel under the copy is
         something the viewer is meant to read, so the scrims are shorter and
         the copy is two lines instead of five. */
      .scrim {
        position: absolute;
        left: 0;
        width: 1080px;
        pointer-events: none;
      }
      .scrim-top {
        top: 0;
        height: 470px;
        background: linear-gradient(180deg, rgba(9,11,26,.96) 0%, rgba(9,11,26,.82) 52%, rgba(9,11,26,0) 100%);
      }
      .scrim-bot {
        bottom: 0;
        height: 430px;
        background: linear-gradient(0deg, rgba(9,11,26,.97) 0%, rgba(9,11,26,.86) 46%, rgba(9,11,26,0) 100%);
      }

      .display {
        font-family: 'Lilita One', system-ui, sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.012em;
        line-height: 0.94;
        -webkit-text-stroke: 0.075em var(--ink);
        paint-order: stroke fill;
        text-shadow: 0 0.05em 0 rgba(0, 0, 0, 0.55);
      }

      #logo {
        position: absolute;
        top: 70px;
        left: 375px;
        width: 330px;
        /* Explicit, never auto — an auto height resolving before the PNG
           decodes stretched the wordmark into a full-height smear. */
        height: 161px;
        display: block;
      }

      #daychip {
        position: absolute;
        top: 248px;
        left: 375px;
        width: 330px;
        display: block;
        text-align: center;
        padding: 12px 0 10px;
        border-radius: 999px;
        border: 4px solid var(--ink);
        background: linear-gradient(180deg, #ffe38a, #ffc422 52%, #e0a105);
        color: #3a2600;
        font-family: 'Lilita One', system-ui, sans-serif;
        text-transform: uppercase;
        font-size: 36px;
        letter-spacing: 0.06em;
        box-shadow: inset 0 3px 0 rgba(255,255,255,.5), 0 8px 0 #8a5c05, 0 14px 26px rgba(0,0,0,.5);
      }

      #headline {
        position: absolute;
        top: 336px;
        left: 60px;
        width: 960px;
        display: block;
        text-align: center;
        font-size: 72px;
        color: #fff;
      }

      /* The caption changes with what is on screen. Each one is its own clip,
         stacked on the same spot, so the framework owns the swap rather than a
         tween fighting over one element's text. */
      .cap {
        position: absolute;
        left: 70px;
        bottom: 252px;
        width: 940px;
        display: block;
        text-align: center;
        font-size: 42px;
        color: var(--gold-hi);
      }
      .capsub {
        position: absolute;
        left: 90px;
        bottom: 170px;
        width: 900px;
        display: block;
        text-align: center;
        font-size: 27px;
        font-weight: 700;
        color: var(--dim);
      }

      #url {
        position: absolute;
        left: 0;
        bottom: 104px;
        width: 1080px;
        display: block;
        text-align: center;
        font-size: 50px;
        color: var(--gold-hi);
      }
      #blitz {
        position: absolute;
        left: 0;
        bottom: 58px;
        width: 1080px;
        display: block;
        text-align: center;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--blue-pale);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="12"
    >
      <div id="scrim-top" class="scrim scrim-top clip" data-start="0" data-duration="12" data-track-index="0"></div>
      <div id="scrim-bot" class="scrim scrim-bot clip" data-start="0" data-duration="12" data-track-index="1"></div>

      <img id="logo" class="clip" src="assets/logo.png" alt="Mempire"
           data-start="0" data-duration="12" data-track-index="2" />

      <div id="daychip" class="clip" data-start="0.3" data-duration="11.7" data-track-index="3">
        Day 3
      </div>

      <h1 id="headline" class="display clip" data-start="0.9" data-duration="11.1" data-track-index="4">
        Every card is a coin you hold
      </h1>

      <!-- Three captions, each timed to the screen underneath it. -->
      <div id="cap1" class="cap display clip" data-start="1.4" data-duration="3.4" data-track-index="5">
        Mint from your bags
      </div>
      <div id="cap1s" class="capsub clip" data-start="1.6" data-duration="3.2" data-track-index="6">
        Only coins you actually hold.
      </div>

      <div id="cap2" class="cap display clip" data-start="5.0" data-duration="3.6" data-track-index="7">
        64 fighters, 64 stories
      </div>
      <div id="cap2s" class="capsub clip" data-start="5.2" data-duration="3.4" data-track-index="8">
        $BTC and $DOGE are not the same knight.
      </div>

      <div id="cap3" class="cap display clip" data-start="8.8" data-duration="2.0" data-track-index="9">
        Stake it to level it
      </div>
      <div id="cap3s" class="capsub clip" data-start="9.0" data-duration="1.8" data-track-index="10">
        A whale buys an edge, never a win.
      </div>

      <div id="url" class="display clip" data-start="10.9" data-duration="1.1" data-track-index="11">
        mempire.fun
      </div>
      <div id="blitz" class="clip" data-start="11.1" data-duration="0.9" data-track-index="12">
        Solana Blitz V7 · @magicblock
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Initial states live inside the tweens. A CSS transform plus a GSAP
      // tween on the same property fight, and lint rejects the pair.
      tl.fromTo('#logo', { y: -36, opacity: 0 }, { y: 0, opacity: 1, duration: 0.65, ease: 'power3.out' }, 0);
      tl.fromTo('#daychip', { scale: 1.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: 'back.out(2.2)' }, 0.3);
      tl.fromTo('#headline', { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: 'power3.out' }, 0.9);

      // Each caption rises in and leaves before its successor arrives, so the
      // two never overlap on the same line.
      [
        ['#cap1', '#cap1s', 1.4, 4.5],
        ['#cap2', '#cap2s', 5.0, 8.3],
        ['#cap3', '#cap3s', 8.8, 10.6],
      ].forEach(function (row) {
        var head = row[0], sub = row[1], t = row[2], out = row[3];
        tl.fromTo(head, { y: 26, opacity: 0 }, { y: 0, opacity: 1, duration: 0.42, ease: 'power3.out' }, t);
        tl.fromTo(sub, { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.42, ease: 'power3.out' }, t + 0.2);
        tl.to(head, { opacity: 0, duration: 0.28, ease: 'power2.in' }, out);
        tl.to(sub, { opacity: 0, duration: 0.28, ease: 'power2.in' }, out);
      });

      // The headline steps aside so the close owns the last beat.
      tl.to('#headline', { y: -22, opacity: 0, duration: 0.4, ease: 'power2.in' }, 10.6);

      tl.fromTo('#url', { scale: 0.88, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: 'back.out(1.8)' }, 10.9);
      tl.fromTo('#blitz', { opacity: 0 }, { opacity: 1, duration: 0.4, ease: 'power2.out' }, 11.1);

      window.__timelines['main'] = tl;
    </script>
  </body>
</html>
